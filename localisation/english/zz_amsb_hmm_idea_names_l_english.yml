l_english:
 # AMSB 2026-07-26: names for the internal AI-debuff ideas in common/ideas/hmm_ideas.txt.
 # They had no localisation at all, which is why the host-tool picker generator skipped
 # them and why they showed as raw tokens in the ideas panel.
 ai_war:0 "AI Debuff: War Economy Cripple"
 ai_war_desc:0 "+10000% consumer goods, -100% factory output, factory efficiency and dockyard output, +10000% factory conversion cost. Applied at game start to the ai_manpower tag list. NOT gated on AI - whoever holds the tag keeps it, and it cannot be removed normally."
 ai_annex:0 "AI Debuff: Annexation Fodder"
 ai_annex_desc:0 "+10000% consumer goods, -100% conscription, factory output, factory efficiency and dockyard output. Applied at game start to the ai_annex tag list. NOT gated on AI - whoever holds the tag keeps it, and it cannot be removed normally."
 ai_tradelaw:0 "AI Debuff: Trade Law Lock"
 ai_tradelaw_desc:0 "+10000% trade law change cost and +10000% factory conversion cost, so trade laws can never be changed. Applied at game start to every tag in the four AI debuff lists. NOT gated on AI."
 blm_ai:0 "AI Debuff: Total Shutdown"
 blm_ai_desc:0 "-1000% factory output and factory efficiency, -1000% conscription, +10000% consumer goods, and the AI wants no divisions. Auto-cancels the moment a human controls the country."
 ai_idea:0 "AI Debuff: Intel and Diplomacy"
 ai_idea_desc:0 "Crippled operative detection and capture, +10000% trade law cost, and doubled war goal justification time both ways. Auto-cancels the moment a human controls the country."
 novols:0 "No Volunteers"
 novols_desc:0 "-100% volunteer force size and no air volunteers. Applied at game start to every playable country except Spain."
 no_faction:0 "Barred From Factions"
 no_faction_desc:0 "Cannot create or join factions. Sending volunteers is still allowed. Used to hold Nationalist Spain out of the Axis until the Civil War resolves."
 fast_training:0 "Accelerated Training"
 fast_training_desc:0 "-89% division training time. Applied to every playable country at game start and intended to stay active all game."
 Spies_no_capture:0 "Operatives Evade Capture"
 Spies_no_capture_desc:0 "-200% enemy operative detection chance and heavily reduced enemy capture chance. Applied to every country at game start."
 dd_torp_nerf:0 "Light Hull Torpedo Nerf"
 dd_torp_nerf_desc:0 "-25% torpedo attack on light ship hulls only. Cruiser-mounted torpedo modules keep full stats. Applied to every country at game start."
 WAR_join_desc:0 "No modifiers of its own. WARNING: removing this idea drags the country into the war on Germany's side against the United Kingdom."
