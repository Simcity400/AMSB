 amsb_scw.2.t:0 "Spain Stays Quiet"
 amsb_scw.2.d:0 "With no Spanish Civil War to observe, no military attachés could be sent to Spain. Instead the general staffs of the world have used the summer of 1936 for exercises and propaganda: every playable and player-controlled nation gains §G+10%§! war support."
 amsb_scw.2.a:0 "Very well."
 amsb_scw.3.t:0 "Nationalist Spain Consolidates"
 amsb_scw.3.d:0 "The Caudillo has spent two years consolidating the Nationalist state. Spain's national focus tree is now available."
 amsb_scw.3.a:0 "¡Arriba España!"
