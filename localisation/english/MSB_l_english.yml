# Start up Event
msb.1.t: "Most Important Changes in MSB"
msb.1.a: "Okay, Thank You"
msb.1.desc: "All Tiles are 80-width + Terrain has more attrition and a larger penalty for attackers (stronger Terrain)\nDispersed Industry has an extra 5% Efficiency Growth on each Tech\nTank Designer Rework:\n - Reworked Modules\n - Nerfed TDs\nSpecial Forces Rework:\n - SF battalions require Support Equipment\n - Amtrac IC + Terrain penalties increased\nArtillery Rework:\n - More Breakthrough\n - More Defense"
msb.6.t: ""
msb.6.a: "Fair winds and following seas"
msb.6.desc: "\n\n - Naval ranges reduced across all hull types; heavy ships cost more fuel and crew.\n - Shore bombardment is twice as effective (capped at 33%).\n - Fleet anti-air barely hits planes — fighters and carriers are the real air defense.\n - Naval invasions: 10-day preparation, unlimited plans, 10 divisions base cap.\n - Shipbuilding: twice the dockyards per line, convoys mass-produced, all dockyards may repair."

# Pacific-removed modes (Scraping the Barrel / Barbarossa) compensation events
msb.2.t: "World Tension Compensation"
msb.2.desc: "Because there is no Japan and no China in this game mode, extra artificial World Tension is needed so that the Allies can consistently stay on 'Partial Mobilization' until the beginning of WW2."
msb.2.a: "Okay, Thank you for the 40 extra World Tension"
msb.4.t: "1941 USA Support"
msb.4.d: "The east coast of the USA is going to be annexed to the UK with cores."
msb.4.a: "Okay, Thank you for the IC."
msb.5.t: "1941 USA Support"
msb.5.desc: "The east coast of the USA has been annexed to the UK."
msb.5.a: "Thanks for the Info"

