 ITA_standardization_spirit:0 "Aircraft Standardization"
 ITA_standardization_spirit_desc:0 "Our aircraft plants share common airframes, parts and tooling. Every model that rolls off the line is cheaper to build - though reworking established designs takes more effort."
 ITA_specialization_spirit:0 "Aircraft Specialization"
 ITA_specialization_spirit_desc:0 "Each of our aircraft plants perfects its own designs. Adapting and upgrading models is quick and cheap - but production runs are shorter and every airframe costs more to build."
