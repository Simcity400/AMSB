# Bookmarks
 SCRAPING_NAME:0 "Scraping the Barrel"
 SCRAPING_SCRAP_DESC:0 "STB Asia for the smallest lobbies: the USA, Japan, China, India, the East Indies and the Philippines are removed from the game, and the remaining minors form the same unions as STB Asia — with Bulgaria part of Spain from the start — so that 9 playable countries cover every remaining front. The UK starts with 5 research slots to compensate the loss of US research and gets the east coast of the USA annexed in 1941."
 STB_ASIA_NAME:0 "STB Asia"
 STB_ASIA_DESC:0 "The whole world including the Pacific Theater is in play, but the minors are merged into unions so that 12 playable countries cover every front. South Africa leads a union with Canada, Australia leads a union with India and Mexico, Romania absorbs Hungary, and Spain may integrate AI-controlled Finland and Bulgaria by decision once fully mobilised. Merged nations' armies transfer at game start, and each union earns its absorbed partners' focus-tree factories and resources through its own industrial focuses."
 SPR_annex_bulgaria:0 "Integrate Bulgaria"
 SPR_annex_bulgaria_desc:0 "Nobody has taken up the Bulgarian cause this game. Once our economy stands on a full war footing - Total Mobilization achieved - we shall administer their lands and armies ourselves so the Balkan front does not go unmanned."
 SPR_annex_finland:0 "Integrate Finland"
 SPR_annex_finland_desc:0 "Our economy now stands on a full war footing. With Total Mobilization achieved, we finally have the means to bring independent Finland fully into the fold - its lands and armies will answer to us."
 AST_annex_mexico:0 "Integrate Mexico"
 AST_annex_mexico_desc:0 "Our economy now stands on a full war footing. With Total Mobilization achieved, we finally have the means to bring independent Mexico fully into the fold - its lands and armies will answer to us."
 FIN_GATHERING_STORM_DESC:0 "Wedged between Scandinavia and a watchful Soviet Union, Finland guards its hard-won independence. A determined people and the Mannerheim Line stand ready should the storm break in the east."
 MSB_union_dev_CAN_tt:0 "§YUnion Development:§! the Canadian half of the union develops alongside us:"
