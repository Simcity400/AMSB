 denmark_occupation_event.4.desc:0 "The Danish government has retained the election rules permitted under the occupation settlement."
 denmark_occupation_event.4.a:0 "Understood."
 denmark_overlord_events.49.t:0 "Danish Administration Secured"
 denmark_overlord_events.49.desc:0 "The administration of the Danish core territories has been consolidated."
 denmark_overlord_events.49.a:0 "Good."
 denmark_events.3.t:0 "Neutrality Policy Revised"
 denmark_events.3.desc:0 "Denmark's declaration of neutrality no longer reflects the country's strategic position."
 denmark_events.3.a:0 "Understood."
